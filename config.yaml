# ==========================================================
# AI-Assisted Emergency Department Triage
# Week 8 Final Model Configuration
# ==========================================================

project:
  name: AI-Assisted ED Triage
  phase: Phase 3
  version: 1.0

seed: 42

paths:
  data: data/triage_cleaned_v1.csv
  model_output: models/final_model.joblib

training:
  test_size: 0.20
  target: esi
  stratify: true
  random_state: 42

model:
  type: LogisticRegression

hyperparameters:
  max_iter: 1000
  random_state: 42

evaluation:
  primary_metric: macro_f1
  secondary_metrics:
    - accuracy
    - precision
    - recall

notes:
  selected_model: Logistic Regression
  reason: >
    Selected as the final Phase 3 model following the Week 7 evaluation.
    Although the Small Multi-Layer Perceptron (MLP) achieved a slightly
    higher Macro-F1 score, the improvement was not sufficient to justify
    the additional model complexity and reduced interpretability.
